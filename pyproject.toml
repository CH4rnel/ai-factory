[project]
name = "ai-factory"
version = "0.1.0"
description = "Local-first AI Media Factory for content generation"
requires-python = ">=3.12,<3.13"
authors = [{name = "CH4rnel"}]
dependencies = [
    "requests>=2.34.2",
    "tqdm>=4.70.1",
]

[dependency-groups]
core = ["pydantic>=2.9", "structlog>=24.4", "typer>=0.15", "tenacity>=9.0"]
gpu = [
    "torch>=2.11.0",
]
dev = ["ruff>=0.8", "mypy>=1.13", "pre-commit>=4.0"]
test = ["pytest>=8.3", "hypothesis>=6.115", "pytest-asyncio>=0.24"]

[tool.uv]
default-groups = ["core", "dev", "test"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
ai-factory = "ai_factory.cli:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
